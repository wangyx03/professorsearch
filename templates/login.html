
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - ProfessorSearch</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 360px;
            padding: 36px;
        }

        .login-card h2 {
            text-align: center;
            margin: 0 0 28px;
        }

        .login-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        .login-card button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .login-error {
            color: #dc2626;
            margin-bottom: 16px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="login-page">
        <div class="card login-card">
            <h2>ProfessorSearch</h2>

            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <div class="login-error">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST">
                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    autocomplete="username"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
